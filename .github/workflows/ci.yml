name: CI

# CI roda em PR (gate de revisao) e apos merge na branch padrao.
on:
  pull_request:
    branches: [feat/dashboard-jurimetria, main, master]
  push:
    branches: [feat/dashboard-jurimetria, main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
